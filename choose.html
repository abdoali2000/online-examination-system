<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bio-NL Exam System — Choose Your Exam</title>
  <meta name="description" content="Select your exam type: Medical Exam or Soft Skills Exam." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body>

  <div class="choose-page">

    <!-- ── Header ── -->
    <header class="choose-header animate__animated animate__fadeInDown">
      <div class="choose-logo">
        <img src="./assets/images/logo.png" alt="Bio NL Logo" class="header-logo" />
        <span class="logo-text">Bio-NL Exam System</span>
      </div>
      <div class="user-meta">
        <span class="welcome-text">Welcome, <strong id="displayName">Student</strong></span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </header>

    <!-- ── Hero ── -->
    <main class="choose-main">
      <div class="choose-hero animate__animated animate__fadeInUp">
        <h1>Select Your Exam</h1>
        <p>Choose the exam type below to begin your assessment</p>
      </div>

      <!-- ── Exam Cards — injected dynamically from Firestore ── -->
      <div class="exam-cards animate__animated animate__fadeInUp" style="animation-delay:0.15s" id="examCardsContainer">
        <!-- Loading skeleton -->
        <div class="exam-card-loading" id="examCardsLoading">
          <div class="card-loading-spinner">⏳</div>
          <p>Loading exams…</p>
        </div>
      </div>
    </main>

    <!-- ── Footer ── -->
    <footer class="choose-footer">
      <p>© 2026 Bio-NL Pharmaceuticals · All rights reserved</p>
    </footer>

  </div>

  <script type="module" src="js/choose.js"></script>
</body>

</html>
